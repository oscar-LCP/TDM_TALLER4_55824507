<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/png" href="icons/icon-192-01.png">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Gestión</a></li>
            <li><a href="catalog.html">Catálogo</a></li>
        </ul>

    <button
    type="button"
    id="toggleThemeBtn"
    class="btn theme-toggle"
    aria-label="Cambiar modo"
>
    <span class="theme-icon" id="themeIcon" aria-hidden="true">🌙</span>
    <span class="theme-label" id="themeLabel">Modo oscuro</span>
    </button>
    </nav>

    <!--formulario para crear y editar-->
    <h1>Gestión de Items</h1>

    <form id="itemForm" class="card">
        <input type="text" id="name" class="input" placeholder="Nombre del item" required>
        <input type="text" id="description" class="input" placeholder="Descripción">
        <input type="number" id="price" class="input" placeholder="Precio"  min="0" step="0.01" required>
        <select id="category" class="input" required>
            <option value="">Elige una categoria</option>
            <option value="Celulares">Celulares</option>
            <option value="Electro">Electro</option>
            <option value="Televisores">Televisores</option>
            <option value="Computadores">Computadores</option>
            <option value="Videojuegos">Videojuegos</option>
            <option value="Audio">Audio</option>
            <option value="Electrohogar">Electrohogar</option>
            <option value="Audifonos">Audifonos</option>
        </select>
        <input type="number" id="stock" class="input" placeholder="Stock" min="0" step="1" required>
        <input type="date" id="date" class="input" placeholder="Fecha" required>
        <input type="url" id="imageUrl" class="input" placeholder="URL de imagen (opcional)">
        <button type="submit" id="submitBtn" class="btn">Agregar</button>
    </form>

    <!--tabla para mostrar los datos-->
    <table>
        <thead>
            <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Fecha</th>
            <th>Imagen</th>
            <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="itemsTable"></tbody>
    </table>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/theme.js"></script>
</body>
</html>
