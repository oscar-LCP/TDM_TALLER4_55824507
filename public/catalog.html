<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Gestión</a></li>
            <li><a href="catalog.html">Catálogo</a></li>
        </ul>

    <button
    type="button"
    id="toggleThemeBtn"
    class="btn theme-toggle"
    aria-label="Cambiar modo"
>
    <span class="theme-icon" id="themeIcon" aria-hidden="true">🌙</span>
    <span class="theme-label" id="themeLabel">Modo oscuro</span>
    </button>
    </nav>
    <!--Catálogo-->
    <h1>Catálogo de Items</h1>
    <input type="search" id="search" class="input" placeholder="Buscar productos...">
    <input type="number" id="minPrice" class="input" placeholder="Precio mínimo">
    <input type="number" id="maxPrice" class="input" placeholder="Precio máximo">
    <br>
    <br>
    <div class="categories">
        <button data-category="">Todos</button>
        <button data-category="Celulares">Celulares</button>
        <button data-category="Electro">Electro</button>
        <button data-category="Televisores">Televisores</button>
        <button data-category="Computadores">Computadores</button>
        <button data-category="Videojuegos">Videojuegos</button>
        <button data-category="Audio">Audio</button>
        <button data-category="Electrohogar">Electrohogar</button>
        <button data-category="Audifonos">Audifonos</button>
    </div>
    <div id="catalogContainer" class="catalog-grid">
    </div>

    <script type="module" src="./js/catalog.js"></script>
    <script type="module" src="./js/theme.js"></script>
</body>
</html>
